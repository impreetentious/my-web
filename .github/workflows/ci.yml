name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run budget:bundle
      - run: npm run budget:performance
      # Playwright smoke suite runs against the committed-content build above;
      # no Sanity credentials are needed in CI.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
