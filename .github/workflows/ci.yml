name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci --prefix studio
      - run: npx --prefix studio tsc --noEmit -p studio/tsconfig.json

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run budget:bundle
      - run: npm run budget:performance
      # Runs Lighthouse 3× per URL and asserts the documented ≥95 floors. This
      # is also what fails on a console CSP violation, which is how a policy
      # that blocks the app's own inline scripts gets caught.
      - run: npm run budget:lighthouse
      # Playwright smoke suite runs against the committed-content build above;
      # no Sanity credentials are needed in CI.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # L6 — both placeholder states must typecheck AND build. Last, because it
      # clears `.next` and leaves it holding the placeholder-enabled build,
      # which is not what the budgets and e2e above are meant to measure.
      - run: node scripts/verify-placeholder-states.mjs
      # The state flip is an env var now, not a rewrite of config/sections.ts.
      # This fails if that ever regresses to mutating tracked source.
      - run: git diff --exit-code
