name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Playwright smoke suite. `npm test` builds against committed content
      # (SANITY_PROJECT_ID is unset → pull-content fails open) then runs the
      # e2e specs — no Sanity credentials needed in CI.
      - run: npx playwright install --with-deps chromium
      - run: npm test
