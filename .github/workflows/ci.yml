name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci --prefix studio
      - run: npm audit --prefix studio --omit=dev --audit-level=high
      - run: npm run typecheck --prefix studio
      - run: npm run build --prefix studio

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run budget:bundle
      - run: npm run budget:performance
      # Runs Lighthouse 3× per URL and asserts the documented ≥95 floors. This
      # is also what fails on a console CSP violation, which is how a policy
      # that blocks the app's own inline scripts gets caught.
      - run: npm run budget:lighthouse
      # Playwright smoke suite runs against the committed-content build above;
      # no Sanity credentials are needed in CI.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Both placeholder states must typecheck and build. This runs last because it
      # clears `.next` and leaves it holding the placeholder-enabled build,
      # which is not what the budgets and e2e above are meant to measure.
      - run: node scripts/verify-placeholder-states.mjs
      # The state flip is environment-driven; fail if any gate mutates source.
      - run: git diff --exit-code
